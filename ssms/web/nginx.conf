# Serves the PWA and proxies /api to the API on the same origin (the refresh cookie is SameSite=Strict).
# TLS is terminated in front of this container (the `edge` Caddy service, a load balancer or host Nginx).
# A template: the image fills ${SSMS_TRUSTED_PROXY} at start (docker-compose.yml sets it).

# The client address is taken from X-Forwarded-For only when the request comes from the TLS proxy we trust;
# anyone else's header is ignored, so nobody can pick their own address for rate limits and the audit log.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;                      # study materials up to 20 MB; the API checks each purpose

    set_real_ip_from ${SSMS_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Look the API up at request time (cached 10 s): after the api container is recreated it has a new address, and
    # a name resolved once at start left every request failing with 502 until web was restarted.
    resolver ${SSMS_RESOLVER} valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;     # one address: the real client (see set_real_ip_from)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass $api_upstream;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;                # client-side routes
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
