# Included in every location that serves the app itself. nginx drops server-level add_header lines in any location
# that has its own add_header, so these must be repeated here, not set once on the server (design/21, finding F8).
# /api/ and /health/ carry the API's own, stricter headers instead.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
