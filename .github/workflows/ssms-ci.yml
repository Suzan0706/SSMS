# SSMS (multi-tenant, ssms/ + design/sql). The single-school version 1 (backend/, db/, docs/) is not built here.
name: ssms-ci

on:
  push:
    paths: ["ssms/**", "design/sql/**", ".github/workflows/ssms-ci.yml"]
  pull_request:
    paths: ["ssms/**", "design/sql/**", ".github/workflows/ssms-ci.yml"]

permissions:
  contents: read

jobs:
  api:
    name: API tests on PostgreSQL 16 (runtime role ssms_app)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust          # throw-away CI database; the tests use password-less roles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: ssms/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ssms/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format check (ruff)
        run: ruff check app tests migrations && ruff format --check app tests migrations
      - name: S3-compatible store for the storage tests (SeaweedFS, as in the objects profile)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 2; done
      - name: SMTP servers for the email tests (Mailpit with a throwaway certificate; STARTTLS and implicit TLS)
        run: |
          mkdir -p /tmp/smtp && cd /tmp/smtp
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 644 key.pem
          for spec in "starttls 51025 58025 --smtp-require-starttls" "tls 51465 58026 --smtp-require-tls"; do
            set -- $spec
            docker run -d --name "mp-$1" -p "$2:1025" -p "$3:8025" -v /tmp/smtp:/certs:ro axllent/mailpit:v1.31.5 \
              --smtp-tls-cert /certs/cert.pem --smtp-tls-key /certs/key.pem "$4" --smtp-auth-accept-any
          done
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:58026/api/v1/info && break; sleep 1; done
      - name: pytest (creates ssms_test, migrates, seeds, runs design/sql/tests as SET ROLE ssms_app)
        env:
          SSMS_TEST_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          SSMS_TEST_S3_URL: http://127.0.0.1:8333
          SSMS_TEST_SMTP_STARTTLS: localhost:51025
          SSMS_TEST_SMTP_TLS: localhost:51465
          SSMS_TEST_SMTP_API: http://127.0.0.1:58025
          SSMS_TEST_SMTP_CA: /tmp/smtp/cert.pem
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ssms/api/coverage.xml

  web:
    name: Web build and size budget
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ssms/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ssms/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run size

  images:
    name: Production images and deployment files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid (with the example settings and every profile)
        run: |
          docker compose -f ssms/docker-compose.yml --env-file ssms/.env.example             --profile edge --profile antivirus --profile objects --profile demo config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -e SSMS_DOMAIN=ssms.example.org -e SSMS_TLS=ops@example.org             -v "$PWD/ssms/ops/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine             caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Ops scripts parse
        run: for f in ssms/ops/*.sh; do sh -n "$f"; done
      - name: Build the API and web images
        run: docker compose -f ssms/docker-compose.yml --env-file ssms/.env.example build migrate web
      - name: The API image starts as a non-root user and imports cleanly
        run: |
          test "$(docker run --rm --entrypoint id ssms-api -u)" != 0
          docker run --rm -e SSMS_ENVIRONMENT=development --entrypoint python ssms-api -c "import app.main"
      - name: Pages and assets carry the security headers (nginx drops them in locations with their own headers)
        run: |
          docker run -d --name web --add-host api:127.0.0.1 -p 8080:8080 ssms-web
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          # No pipes that stop reading early (head, grep -q): under the runner's pipefail they fail the step at random.
          page=$(curl -sf http://127.0.0.1:8080/)
          asset=$(grep -o '/assets/[^"]*\.js' <<<"$page" | sed -n 1p)
          [ -n "$asset" ] || { echo "no script asset in the page"; exit 1; }
          for path in / /login /sw.js "$asset"; do
            headers=$(curl -s -D - -o /dev/null "http://127.0.0.1:8080$path")
            grep -qi '^content-security-policy:.*frame-ancestors' <<<"$headers" || { echo "no CSP on $path"; exit 1; }
            grep -qi '^x-frame-options: DENY' <<<"$headers" || { echo "no X-Frame-Options on $path"; exit 1; }
          done

  e2e:
    name: Playwright end-to-end
    needs: [api, web]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SSMS_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ssms
      SSMS_DATABASE_URL: postgresql+psycopg://ssms_app@localhost:5432/ssms
      SSMS_PLATFORM_DATABASE_URL: postgresql+psycopg://ssms_console@localhost:5432/ssms
      SSMS_ENVIRONMENT: development
      SSMS_COOKIE_SECURE: "false"
      SSMS_TASKS_INLINE: "true"
      SSMS_SMS_PROVIDER: console
      SSMS_STORAGE_DIR: /tmp/ssms-files
      SSMS_LOGIN_ATTEMPTS_PER_MINUTE: "60"  # the whole E2E suite signs in from one IP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Database (migrations, logins, demo seed)
        working-directory: ssms/api
        run: |
          pip install .
          psql -h localhost -U postgres -c "CREATE DATABASE ssms"
          alembic upgrade head
          SSMS_APP_DB_PASSWORD=ci SSMS_CONSOLE_DB_PASSWORD=ci python -m app.cli db-logins
          psql -h localhost -U postgres -d ssms -v ON_ERROR_STOP=1 -f ../../design/sql/seed.sql
      - name: Start API
        working-directory: ssms/api
        run: |
          export SSMS_ENC_KEYS="1:$(openssl rand -base64 32)" SSMS_BLIND_INDEX_KEY="$(openssl rand -base64 32)"
          PORT=8000 nohup python scripts/e2e_api.py > /tmp/ssms-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health/ready && break; sleep 1; done
      - name: Playwright
        working-directory: ssms/web
        env:
          E2E_API_LOG: /tmp/ssms-api.log
          E2E_BROWSER_CHANNEL: chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            ssms/web/test-results
            /tmp/ssms-api.log
