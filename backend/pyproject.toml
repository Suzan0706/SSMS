[project]
name = "sms-backend"
version = "1.0.0"
description = "School Management System API (FastAPI + PostgreSQL) for Tanzanian schools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "cryptography>=43",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
